<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MuQwiz — Аккаунт</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><main class="app-container" style="max-width:520px;margin:8vh auto;padding:16px"><section id="mq-account-page" class="card" style="padding:24px"><div class="logo">Mu<span>Qwiz</span></div><h1 id="mq-mode-label" class="page-title">Вход</h1><p style="margin-bottom:16px">Войди, чтобы синхронизировать викторины и заметки между устройствами.</p><label for="mq-username">Логин</label><input id="mq-username" class="input-field" autocomplete="username" maxlength="24" placeholder="Логин" style="margin:6px 0 12px"><div id="mq-email-row" class="hidden"><label for="mq-email">Почта</label><input id="mq-email" type="email" class="input-field" autocomplete="email" placeholder="you@example.com" style="margin:6px 0 12px"></div><label for="mq-password">Пароль</label><input id="mq-password" type="password" class="input-field" autocomplete="current-password" placeholder="Минимум 10 символов" style="margin:6px 0 12px"><div id="mq-repeat-row" class="hidden"><label for="mq-password-repeat">Повтори пароль</label><input id="mq-password-repeat" type="password" class="input-field" autocomplete="new-password" placeholder="Повтори пароль" style="margin:6px 0 12px"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="mq-login-btn" class="btn btn-primary">Войти</button><button id="mq-register-btn" class="btn btn-primary hidden">Создать аккаунт</button><button id="mq-show-register" class="btn btn-secondary">Регистрация</button><button id="mq-show-login" class="btn btn-secondary">Уже есть аккаунт</button></div><button id="mq-reset" class="btn btn-secondary" style="margin-top:10px">Забыли пароль?</button><p id="mq-auth-message" role="status" style="margin-top:12px"></p><hr style="margin:18px 0;opacity:.25"><button id="mq-guest" class="btn btn-secondary">Продолжить без аккаунта</button></section></main><script src="js/app.js"></script><script src="account.js"></script></body></html>
