<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuQwiz — Подготовка</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="app">
        <div class="app-container">
            <div class="page active" id="page-prepare">
                <div class="page-title">🎧 Подготовка</div>
                
                <!-- Выбор викторины -->
                <div class="prepare-select">
                    <select class="select-field" id="prepareSelect">
                        <option value="">— выбери викторину —</option>
                    </select>
                </div>

                <!-- Кнопка перехода к викторине -->
                <button class="btn btn-gold" id="gotoQuizBtn" style="margin-bottom:16px; display:none;">
                    🎯 Перейти к викторине
                </button>

                <!-- Плеер -->
                <div class="player-area">
                    <audio id="playerAudio" controls></audio>
                    <div class="player-controls">
                        <button class="btn btn-sm btn-secondary" id="playPrev">⏮</button>
                        <button class="btn btn-sm btn-secondary" id="playNext">⏭</button>
                        <button class="btn btn-sm btn-secondary" id="playShuffle">🔀 Перемешать</button>
                    </div>
                </div>

                <!-- Список треков с заметками -->
                <div id="trackListPrepare" class="track-list-prepare">
                    <div style="text-align:center;color:var(--text-secondary);padding:20px;">
                        Выбери викторину, чтобы увидеть треки
                    </div>
                </div>
            </div>
        </div>

        <!-- Нижняя навигация -->
        <div class="bottom-nav">
            <a href="index.html"><span class="icon">📚</span> Библиотека</a>
            <a href="prepare.html" class="active"><span class="icon">🎧</span> Подготовка</a>
            <a href="quiz.html"><span class="icon">🎯</span> Викторина</a>
            <a href="results.html"><span class="icon">📊</span> Результаты</a>
            <a href="settings.html"><span class="icon">⚙️</span> Настройки</a>
        </div>
    </div>

    <!-- Подключаем скрипт -->
    <script src="js/app.js"></script>
</body>
</html>
