<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuQwiz — Викторина</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="app">
        <div class="app-container">
            <div class="page active" id="page-quiz">
                <div class="page-title">🎯 Викторина</div>

                <div id="quizSetup">
                    <div class="card">
                        <div class="form-group">
                            <label>Выбери викторину</label>
                            <select class="select-field" id="quizSelect">
                                <option value="">— выбери викторину —</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" id="startQuizBtn">▶ Начать викторину</button>
                    </div>
                </div>

                <div id="gameScreen" class="hidden">
                    <div class="game-header">
                        <span class="question-num" id="questionNum">Вопрос 1 из 20</span>
                        <span class="timer" id="timerDisplay">1:30</span>
                    </div>
                    <div class="game-player">
                        <audio id="gameAudio" controls></audio>
                    </div>
                    <div id="gameQuestion"></div>
                    <div class="game-actions">
                        <button class="btn btn-gold" id="hintBtn">💡 Подсказка</button>
                        <button class="btn btn-primary" id="submitBtn">✅ Ответить</button>
                    </div>
                    <div id="gameFeedback"></div>
                </div>

                <div id="finalScreen" class="hidden">
                    <div id="finalContent"></div>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="index.html"><span class="icon">📚</span> Библиотека</a>
            <a href="prepare.html"><span class="icon">🎧</span> Подготовка</a>
            <a href="quiz.html" class="active"><span class="icon">🎯</span> Викторина</a>
            <a href="results.html"><span class="icon">📊</span> Результаты</a>
            <a href="settings.html"><span class="icon">⚙️</span> Настройки</a>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
