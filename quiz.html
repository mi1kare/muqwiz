<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MuQwiz — Викторина</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Иконки для iPhone и браузера (тоже в head) -->
    <link rel="icon" href="assets/icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest" defer></script>
<script>
(function(){
 const icons={"📚":"library","📖":"book-open","🎧":"headphones","🎯":"target","📊":"chart-no-axes-column-increasing","⚙️":"settings","⚙":"settings","📂":"folder-open","❤️":"heart","📥":"download","➕":"plus","🎵":"music-2","🚀":"rocket","📁":"folder","☁️":"cloud","☁":"cloud","🔑":"key-round","🔍":"search","💾":"save","🔀":"shuffle","⏮":"skip-back","⏭":"skip-forward","📭":"inbox","🗑️":"trash-2","🗑":"trash-2","▶️":"play","▶":"play","⏸":"pause","⭐":"star","✏️":"pencil","✏":"pencil","❌":"x","✅":"check","🔗":"link","🔒":"lock","👤":"user-round","📤":"upload","🔄":"refresh-cw","ℹ️":"info","ℹ":"info","🏠":"house","🎼":"music"};
 const re=new RegExp(Object.keys(icons).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
 function convert(root){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); const nodes=[];
  while(walker.nextNode()) if(re.test(walker.currentNode.nodeValue)){nodes.push(walker.currentNode);re.lastIndex=0;}
  nodes.forEach(node=>{const value=node.nodeValue;const frag=document.createDocumentFragment();let last=0;value.replace(re,(match,offset)=>{frag.append(document.createTextNode(value.slice(last,offset)));const i=document.createElement('i');i.setAttribute('data-lucide',icons[match]||'music-2');i.className='lucide-inline';frag.append(i);last=offset+match.length;return match;});frag.append(document.createTextNode(value.slice(last)));node.parentNode.replaceChild(frag,node);});
  if(window.lucide) window.lucide.createIcons({attrs:{'stroke-width':1.8}});
 }
 document.addEventListener('DOMContentLoaded',()=>{convert(document.body);const observer=new MutationObserver(records=>records.forEach(r=>r.addedNodes.forEach(n=>{if(n.nodeType===1)convert(n);else if(n.nodeType===3&&n.parentNode)convert(n.parentNode);})));observer.observe(document.body,{childList:true,subtree:true});});
})();
</script>
</head>
<body>

    <div id="app">
        <div class="app-container">
            <div class="page active" id="page-quiz">
                <div class="page-title">🎯 Викторина</div>

                <!-- ===== ЭКРАН НАСТРОЙКИ ===== -->
                <div id="quizSetup">
                    <div class="card">
                        <div class="form-group">
                            <label>Выбери викторину</label>
                            <select class="select-field" id="quizSelect">
                                <option value="">— выбери викторину —</option>
                            </select>
                        </div>

                        <div class="settings-row">
                            <span>Количество вопросов</span>
                            <input type="number" id="quizCount" value="10" min="1" max="100">
                        </div>

                        <label style="font-weight:600;display:block;margin:16px 0 10px;">Выберите уровень сложности:</label>
                        <div class="level-buttons" id="levelButtons">
                            <button class="level-btn selected" data-level="easy">
                                <span class="level-name">🟢 Лёгкий</span>
                                <span class="level-desc">4 варианта<br>⏱ 1:30<br>💡 3 подсказки</span>
                            </button>
                            <button class="level-btn" data-level="medium">
                                <span class="level-name">🟡 Средний</span>
                                <span class="level-desc">Вписать название<br>⏱ 1:00<br>💡 3 подсказки</span>
                            </button>
                            <button class="level-btn" data-level="hard">
                                <span class="level-name">🔴 Сложный</span>
                                <span class="level-desc">Случайный фрагмент<br>⏱ 0:45<br>💡 1 подсказка</span>
                            </button>
                        </div>

                        <button class="btn btn-primary" id="startQuizBtn">▶ Начать викторину</button>
                    </div>
                </div>

                <!-- ===== ИГРОВОЙ ЭКРАН ===== -->
                <div id="gameScreen" class="hidden">
                    <div class="game-header">
                        <span class="question-num" id="questionNum">Вопрос 1 из 10</span>
                        <span class="timer" id="timerDisplay">1:30</span>
                    </div>
                    <div class="game-player">
                        <audio id="gameAudio" controls></audio>
                    </div>
                    <div id="gameQuestion"></div>
                    <div class="game-actions">
                        <button class="btn btn-gold" id="hintBtn">💡 Подсказка (3)</button>
                        <button class="btn btn-primary" id="submitBtn">✅ Ответить</button>
                    </div>
                    <div id="gameFeedback"></div>
                </div>

                <!-- ===== ЭКРАН РЕЗУЛЬТАТОВ ===== -->
                <div id="finalScreen" class="hidden">
                    <div id="finalContent"></div>
                </div>
            </div>
        </div>

        <!-- Нижняя навигация -->
        <div class="bottom-nav">
            <a href="index.html"><span class="icon">📚</span> Библиотека</a>
            <a href="prepare.html"><span class="icon">🎧</span> Подготовка</a>
            <a href="quiz.html" class="active"><span class="icon">🎯</span> Викторина</a>
            <a href="results.html"><span class="icon">📊</span> Результаты</a>
            <a href="settings.html"><span class="icon">⚙️</span> Настройки</a>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="account.js"></script>
</body>
</html>
