<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuQwiz — Викторина</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="app">
        <div class="app-container">
            <div class="page active" id="page-quiz">
                <div class="page-title">🎯 Викторина</div>

                <!-- ===== ЭКРАН НАСТРОЙКИ ===== -->
                <div id="quizSetup">
                    <div class="card">
                        <div class="form-group">
                            <label>Выбери викторину</label>
                            <select class="select-field" id="quizSelect">
                                <option value="">— выбери викторину —</option>
                            </select>
                        </div>

                        <div class="settings-row">
                            <span>Количество вопросов</span>
                            <input type="number" id="quizCount" value="10" min="1" max="100">
                        </div>

                        <label style="font-weight:600;display:block;margin:16px 0 10px;">Выберите уровень сложности:</label>
                        <div class="level-buttons" id="levelButtons">
                            <button class="level-btn selected" data-level="easy">
                                <span class="level-name">🟢 Лёгкий</span>
                                <span class="level-desc">4 варианта<br>⏱ 1:30<br>💡 3 подсказки</span>
                            </button>
                            <button class="level-btn" data-level="medium">
                                <span class="level-name">🟡 Средний</span>
                                <span class="level-desc">Вписать название<br>⏱ 1:00<br>💡 3 подсказки</span>
                            </button>
                            <button class="level-btn" data-level="hard">
                                <span class="level-name">🔴 Сложный</span>
                                <span class="level-desc">С середины<br>⏱ 0:45<br>💡 1 подсказка</span>
                            </button>
                        </div>

                        <button class="btn btn-primary" id="startQuizBtn">▶ Начать викторину</button>
                    </div>
                </div>

                <!-- ===== ИГРОВОЙ ЭКРАН ===== -->
                <div id="gameScreen" class="hidden">
                    <div class="game-header">
                        <span class="question-num" id="questionNum">Вопрос 1 из 10</span>
                        <span class="timer" id="timerDisplay">1:30</span>
                    </div>
                    <div class="game-player">
                        <audio id="gameAudio" controls></audio>
                    </div>
                    <div id="gameQuestion"></div>
                    <div class="game-actions">
                        <button class="btn btn-gold" id="hintBtn">💡 Подсказка (3)</button>
                        <button class="btn btn-primary" id="submitBtn">✅ Ответить</button>
                    </div>
                    <div id="gameFeedback"></div>
                </div>

                <!-- ===== ЭКРАН РЕЗУЛЬТАТОВ ===== -->
                <div id="finalScreen" class="hidden">
                    <div id="finalContent"></div>
                </div>
            </div>
        </div>

        <!-- Нижняя навигация -->
        <div class="bottom-nav">
            <a href="index.html"><span class="icon">📚</span> Библиотека</a>
            <a href="prepare.html"><span class="icon">🎧</span> Подготовка</a>
            <a href="quiz.html" class="active"><span class="icon">🎯</span> Викторина</a>
            <a href="results.html"><span class="icon">📊</span> Результаты</a>
            <a href="settings.html"><span class="icon">⚙️</span> Настройки</a>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
