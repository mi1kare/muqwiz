<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuQwiz — Результаты</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Иконки для iPhone и браузера (тоже в head) -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div id="app">
        <div class="app-container">
            <div class="page active" id="page-results">
                <div class="page-title">📊 Результаты</div>

                <!-- Общая статистика -->
                <div id="statsSummary" class="stats-summary hidden"></div>

                <!-- Список результатов -->
                <div id="resultsList">
                    <div class="card" style="text-align:center;padding:40px;color:var(--text-secondary);">
                        📭 Здесь будут твои результаты<br>
                        <small>Пройди викторину, чтобы увидеть статистику</small>
                    </div>
                </div>

                <!-- Кнопка очистки -->
                <button class="btn btn-secondary" id="clearResultsBtn" style="margin-top:8px;">🗑️ Очистить историю</button>
            </div>
        </div>

        <!-- Нижняя навигация -->
        <div class="bottom-nav">
            <a href="index.html"><span class="icon">📚</span> Библиотека</a>
            <a href="prepare.html"><span class="icon">🎧</span> Подготовка</a>
            <a href="quiz.html"><span class="icon">🎯</span> Викторина</a>
            <a href="results.html" class="active"><span class="icon">📊</span> Результаты</a>
            <a href="settings.html"><span class="icon">⚙️</span> Настройки</a>
        </div>
    </div>

    <script src="js/app.js"></script>
