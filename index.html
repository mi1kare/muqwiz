<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MuQwiz — Библиотека</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- MuQwiz icons: browser tab, installed app, iPhone -->
    <link rel="icon" href="./assets/icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#78a4c4">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

    <!-- Google Identity Services (для OAuth и скачивания с Google Drive) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
(function(){
 const icons={"📚":"library","📖":"book-open","🎧":"headphones","🎯":"target","📊":"chart-no-axes-column-increasing","⚙️":"settings","⚙":"settings","📂":"folder-open","❤️":"heart","📥":"download","➕":"plus","🎵":"music-2","🚀":"rocket","📁":"folder","☁️":"cloud","☁":"cloud","🔑":"key-round","🔍":"search","💾":"save","🔀":"shuffle","⏮":"skip-back","⏭":"skip-forward","📭":"inbox","🗑️":"trash-2","🗑":"trash-2","▶️":"play","▶":"play","⏸":"pause","⭐":"star","✏️":"pencil","✏":"pencil","❌":"x","✅":"check","🔗":"link","🔒":"lock","👤":"user-round","📤":"upload","🔄":"refresh-cw","ℹ️":"info","ℹ":"info","🏠":"house","🎼":"music"};
 const re=new RegExp(Object.keys(icons).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
 function convert(root){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); const nodes=[];
  while(walker.nextNode()) if(re.test(walker.currentNode.nodeValue)){nodes.push(walker.currentNode);re.lastIndex=0;}
  nodes.forEach(node=>{const value=node.nodeValue;const frag=document.createDocumentFragment();let last=0;value.replace(re,(match,offset)=>{frag.append(document.createTextNode(value.slice(last,offset)));const i=document.createElement('i');i.setAttribute('data-lucide',icons[match]||'music-2');i.className='lucide-inline';frag.append(i);last=offset+match.length;return match;});frag.append(document.createTextNode(value.slice(last)));node.parentNode.replaceChild(frag,node);});
  if(window.lucide) window.lucide.createIcons({attrs:{'stroke-width':1.8}});
 }
 document.addEventListener('DOMContentLoaded',()=>{convert(document.body);const observer=new MutationObserver(records=>records.forEach(r=>r.addedNodes.forEach(n=>{if(n.nodeType===1)convert(n);else if(n.nodeType===3&&n.parentNode)convert(n.parentNode);})));observer.observe(document.body,{childList:true,subtree:true});});
})();
</script>
</head>
<body>

    <div id="onboarding">
        <div class="card">
            <div class="logo">Mu<span>Qwiz</span></div>
            <div class="sub">🎵 Самоподготовка к музыкальным викторинам</div>
            <div class="form-group">
                <label>Как мне к тебе обращаться?</label>
                <input type="text" class="input-field" id="userName" placeholder="Введите имя...">
            </div>
            <button class="btn btn-primary" id="onboardingFinish">🚀 Начать!</button>
        </div>
    </div>

    <div id="app" class="hidden">
        <div class="app-container">
            <div class="page active" id="page-library">
                <div class="page-title">📚 Библиотека</div>
                
                <div class="tabs" id="libraryTabs">
                    <button class="active" data-tab="my">📂 Мои</button>
                    <button data-tab="favorites">❤️ Избранное</button>
                    <button data-tab="shared">📥 Загруженное</button>
                </div>

                <div id="libraryContent"></div>

                <button class="btn btn-primary" id="showAddForm" style="margin-top:8px;">➕ Добавить викторину</button>

                <div id="addForm" class="card hidden" style="margin-top:16px;">
                    <div class="form-group">
                        <label>Название викторины</label>
                        <input type="text" class="input-field" id="newQuizName" placeholder="Например: Бах. Органные произведения">
                    </div>
                    
                    <div class="form-group">
                        <label>Где сохранить викторину?</label>
                        <select class="select-field" id="quizCreateSaveMode">
                            <option value="local">Только на этом устройстве</option>
                            <option value="cloud">В облаке — общая викторина по ссылке</option>
                        </select>
                        <small id="quizCreateModeWarning" style="display:block;margin-top:7px;color:var(--text-secondary);">Локальную викторину можно редактировать на этом устройстве. Она не появится у других пользователей.</small>
                    </div>
                    <div class="form-group">
                        <label>Способ добавления</label>
                        <select class="select-field" id="addMethod">
                            <option value="files">📁 Загрузить файлы с устройства</option>
                            <option value="gdrive" hidden>☁️ Сканировать Google Диск</option>
                        </select>
                    </div>

                    <div id="addMethodFiles">
                        <div class="form-group">
                            <label>Выберите MP3 файлы</label>
                            <input type="file" id="fileInput" accept=".mp3" multiple class="input-field" style="padding: 10px;">
                        </div>
                    </div>

                    <div id="addMethodGdrive" class="hidden" hidden>
                        <!-- Блок авторизации Google -->
                        <div class="form-group">
                            <label>Доступ к Google Диску</label>
                            <button type="button" id="googleAuthBtn" class="btn btn-secondary">🔑 Войти через Google</button>
                            <span id="googleAuthStatus" style="display:block;margin-top:6px;font-size:13px;color:var(--text-secondary);">
                                Для скачивания с Google Drive нужна авторизация
                            </span>
                        </div>

                        <div class="form-group">
                            <label>Ссылка на папку Google Диска</label>
                            <input type="url" class="input-field" id="gdriveLink" placeholder="https://drive.google.com/drive/folders/...">
                        </div>
                        <button class="btn btn-secondary" id="scanGdriveBtn">🔍 Сканировать папку</button>
                        <div id="gdriveProgress" class="hidden" style="text-align:center; margin-top:12px;"><div class="loader"></div></div>
                        <div id="gdriveResult" class="hidden" style="margin-top:12px; font-size:14px;"></div>
                    </div>

                    <div id="quizUploadProgress" class="hidden" style="margin-top:14px;"></div>
                    <button class="btn btn-primary" id="saveQuizBtn" style="margin-top:16px;">💾 Сохранить</button>
                    <button class="btn btn-secondary" id="cancelAddBtn" style="margin-top:8px;">Отмена</button>
                </div>

                <div id="sharedTabContent" class="hidden" style="margin-top: 16px;">
                    <div class="card">
                        <div class="form-group">
                            <label>Вставьте ссылку на викторину</label>
                            <input type="url" class="input-field" id="sharedLink" placeholder="https://твой-сайт.ru/?quiz=123">
                        </div>
                        <button class="btn btn-primary" id="loadSharedBtn">📥 Загрузить из базы</button>
                        <div id="sharedProgress" class="hidden" style="text-align:center; margin-top:12px;"><div class="loader"></div></div>
                        <div id="sharedResult" class="hidden" style="margin-top:12px; font-size:14px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="index.html" class="active"><span class="icon">📚</span> Библиотека</a>
            <a href="prepare.html"><span class="icon">🎧</span> Подготовка</a>
            <a href="quiz.html"><span class="icon">🎯</span> Викторина</a>
            <a href="results.html"><span class="icon">📊</span> Результаты</a>
            <a href="settings.html"><span class="icon">⚙️</span> Настройки</a>
        </div>
    </div>

    <!-- app.js подключаем с defer, чтобы DOM был готов к моменту выполнения -->
    <script src="js/app.js" defer></script>
    <script src="account.js" defer></script>
</body>
</html>
