<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuQwiz — Библиотека</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Google Identity Services (для OAuth и скачивания с Google Drive) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <div id="onboarding">
        <div class="card">
            <div class="logo">Mu<span>Qwiz</span></div>
            <div class="sub">🎵 Самоподготовка к музыкальным викторинам</div>
            <div class="form-group">
                <label>Как мне к тебе обращаться?</label>
                <input type="text" class="input-field" id="userName" placeholder="Введите имя...">
            </div>
            <button class="btn btn-primary" id="onboardingFinish">🚀 Начать!</button>
        </div>
    </div>

    <div id="app" class="hidden">
        <div class="app-container">
            <div class="page active" id="page-library">
                <div class="page-title">📚 Библиотека</div>
                
                <div class="tabs" id="libraryTabs">
                    <button class="active" data-tab="my">📂 Мои</button>
                    <button data-tab="favorites">❤️ Избранное</button>
                    <button data-tab="shared">📥 Загруженное</button>
                </div>

                <div id="libraryContent"></div>

                <button class="btn btn-primary" id="showAddForm" style="margin-top:8px;">➕ Добавить викторину</button>

                <div id="addForm" class="card hidden" style="margin-top:16px;">
                    <div class="form-group">
                        <label>Название викторины</label>
                        <input type="text" class="input-field" id="newQuizName" placeholder="Например: Бах. Органные произведения">
                    </div>
                    
                    <div class="form-group">
                        <label>Способ добавления</label>
                        <select class="select-field" id="addMethod">
                            <option value="files">📁 Загрузить файлы с устройства</option>
                            <option value="gdrive">☁️ Сканировать Google Диск</option>
                            <option value="manual">🔗 Вставить ссылки вручную</option>
                        </select>
                    </div>

                    <div id="addMethodFiles">
                        <div class="form-group">
                            <label>Выберите MP3 файлы</label>
                            <input type="file" id="fileInput" accept=".mp3" multiple class="input-field" style="padding: 10px;">
                        </div>
                    </div>

                    <div id="addMethodGdrive" class="hidden">
                        <!-- Блок авторизации Google -->
                        <div class="form-group">
                            <label>Доступ к Google Диску</label>
                            <button type="button" id="googleAuthBtn" class="btn btn-secondary">🔑 Войти через Google</button>
                            <span id="googleAuthStatus" style="display:block;margin-top:6px;font-size:13px;color:var(--text-secondary);">
                                Для скачивания с Google Drive нужна авторизация
                            </span>
                        </div>

                        <div class="form-group">
                            <label>Ссылка на папку Google Диска</label>
                            <input type="url" class="input-field" id="gdriveLink" placeholder="https://drive.google.com/drive/folders/...">
                        </div>
                        <button class="btn btn-secondary" id="scanGdriveBtn">🔍 Сканировать папку</button>
                        <div id="gdriveProgress" class="hidden" style="text-align:center; margin-top:12px;"><div class="loader"></div></div>
                        <div id="gdriveResult" class="hidden" style="margin-top:12px; font-size:14px;"></div>
                    </div>

                    <div id="addMethodManual" class="hidden">
                        <div class="form-group">
                            <label>Ссылки на MP3 (по одной в строке)</label>
                            <textarea class="input-field" id="trackFiles" rows="3"></textarea>
                        </div>
                    </div>

                    <button class="btn btn-primary" id="saveQuizBtn" style="margin-top:16px;">💾 Сохранить</button>
                    <button class="btn btn-secondary" id="cancelAddBtn" style="margin-top:8px;">Отмена</button>
                </div>

                <div id="sharedTabContent" class="hidden" style="margin-top: 16px;">
                    <div class="card">
                        <div class="form-group">
                            <label>Вставьте ссылку на викторину</label>
                            <input type="url" class="input-field" id="sharedLink" placeholder="https://твой-сайт.ru/?quiz=123">
                        </div>
                        <button class="btn btn-primary" id="loadSharedBtn">📥 Загрузить из базы</button>
                        <div id="sharedProgress" class="hidden" style="text-align:center; margin-top:12px;"><div class="loader"></div></div>
                        <div id="sharedResult" class="hidden" style="margin-top:12px; font-size:14px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="index.html" class="active"><span class="icon">📚</span> Библиотека</a>
            <a href="prepare.html"><span class="icon">🎧</span> Подготовка</a>
            <a href="quiz.html"><span class="icon">🎯</span> Викторина</a>
            <a href="results.html"><span class="icon">📊</span> Результаты</a>
            <a href="settings.html"><span class="icon">⚙️</span> Настройки</a>
        </div>
    </div>

    <!-- app.js подключаем с defer, чтобы DOM был готов к моменту выполнения -->
    <script src="js/app.js" defer></script>
</body>
</html>
