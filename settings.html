<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuQwiz — Настройки</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="app">
        <div class="app-container">
            
            <!-- ===== СТРАНИЦА НАСТРОЕК ===== -->
            <div class="page active" id="page-settings">
                <div class="page-title">⚙️ Настройки</div>

                <div class="settings-group">
                    <div class="title">👤 Профиль</div>
                    <div class="settings-row">
                        <span class="label">Имя</span>
                        <span id="settingsName" style="font-weight:600;">—</span>
                    </div>
                    <button class="btn btn-sm btn-secondary" id="editProfileBtn" style="margin-top:8px;width:auto;">✏️ Изменить имя</button>
                </div>

                <div class="settings-group">
                    <div class="title">🎨 Внешний вид</div>
                    <div class="settings-row">
                        <span class="label">Тема</span>
                        <select id="themeSelect">
                            <option value="light">☀️ Светлая</option>
                            <option value="dark">🌙 Тёмная</option>
                        </select>
                    </div>
                </div>

                <div class="settings-group">
                    <div class="title">🔊 Звук</div>
                    <div class="settings-row">
                        <span class="label">Звук ответа</span>
                        <div class="toggle active" id="soundToggle">
                            <div class="slider"></div>
                        </div>
                    </div>
                    <div class="settings-row">
                        <span class="label">Громкость</span>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
                    </div>
                </div>

                <div class="settings-group">
                    <div class="title">📦 Данные</div>
                    <div class="settings-row">
                        <span class="label">Кэш (офлайн-данные)</span>
                        <button class="btn btn-sm btn-secondary" id="clearCacheBtn">🗑️ Очистить</button>
                    </div>
                </div>

                <div class="settings-group">
                    <div class="title">ℹ️ О приложении</div>
                    <div class="settings-row">
                        <span class="label">Версия</span>
                        <span>1.0.0</span>
                    </div>
                    <div class="settings-row">
                        <span class="label">MuQwiz 🎵</span>
                        <span>Для музыкальных викторин</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- ===== НИЖНЯЯ ПАНЕЛЬ ===== -->
        <div class="bottom-nav">
            <a href="index.html"><span class="icon">📚</span> Библиотека</a>
            <a href="prepare.html"><span class="icon">🎧</span> Подготовка</a>
            <a href="quiz.html"><span class="icon">🎯</span> Викторина</a>
            <a href="results.html"><span class="icon">📊</span> Результаты</a>
            <a href="settings.html" class="active"><span class="icon">⚙️</span> Настройки</a>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
