<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MuQwiz — Новый пароль</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><main class="app-container"><section class="card"><h1 class="page-title">🔐 Новый пароль</h1><p style="margin-bottom:12px">Введи новый пароль для аккаунта MuQwiz.</p><input id="newPassword" class="input-field" type="password" minlength="10" autocomplete="new-password" placeholder="Новый пароль (от 10 символов)"><button id="savePassword" class="btn btn-primary" style="margin-top:12px">Сохранить пароль</button><p id="message" role="status" style="margin-top:12px"></p><a href="index.html">Вернуться в MuQwiz</a></section></main><script>
const client=window.supabase.createClient('https://xleqzgqiwayloeeewagv.supabase.co','sb_publishable_ptX6EsSAH92n9XFcP-v9dA_EAOIF7kG');
client.auth.onAuthStateChange((_event,session)=>{if(session) document.getElementById('message').textContent='Ссылка подтверждена. Можно задать новый пароль.';});
document.getElementById('savePassword').addEventListener('click',async()=>{const p=document.getElementById('newPassword').value;const m=document.getElementById('message');if(p.length<10){m.textContent='Пароль должен содержать минимум 10 символов.';return;}const {error}=await client.auth.updateUser({password:p});m.textContent=error?error.message:'Пароль обновлён. Теперь войди с новым паролем.';});
</script></body></html>
