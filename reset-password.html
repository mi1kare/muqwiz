<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MuQwiz — Новый пароль</title><link rel="stylesheet" href="css/style.css"><link rel="icon" href="assets/icons/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png"><link rel="manifest" href="manifest.json"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/lucide@latest" defer></script>
<script>
(function(){
 const icons={"📚":"library","📖":"book-open","🎧":"headphones","🎯":"target","📊":"chart-no-axes-column-increasing","⚙️":"settings","⚙":"settings","📂":"folder-open","❤️":"heart","📥":"download","➕":"plus","🎵":"music-2","🚀":"rocket","📁":"folder","☁️":"cloud","☁":"cloud","🔑":"key-round","🔍":"search","💾":"save","🔀":"shuffle","⏮":"skip-back","⏭":"skip-forward","📭":"inbox","🗑️":"trash-2","🗑":"trash-2","▶️":"play","▶":"play","⏸":"pause","⭐":"star","✏️":"pencil","✏":"pencil","❌":"x","✅":"check","🔗":"link","🔒":"lock","👤":"user-round","📤":"upload","🔄":"refresh-cw","ℹ️":"info","ℹ":"info","🏠":"house","🎼":"music"};
 const re=new RegExp(Object.keys(icons).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
 function convert(root){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); const nodes=[];
  while(walker.nextNode()) if(re.test(walker.currentNode.nodeValue)){nodes.push(walker.currentNode);re.lastIndex=0;}
  nodes.forEach(node=>{const value=node.nodeValue;const frag=document.createDocumentFragment();let last=0;value.replace(re,(match,offset)=>{frag.append(document.createTextNode(value.slice(last,offset)));const i=document.createElement('i');i.setAttribute('data-lucide',icons[match]||'music-2');i.className='lucide-inline';frag.append(i);last=offset+match.length;return match;});frag.append(document.createTextNode(value.slice(last)));node.parentNode.replaceChild(frag,node);});
  if(window.lucide) window.lucide.createIcons({attrs:{'stroke-width':1.8}});
 }
 document.addEventListener('DOMContentLoaded',()=>{convert(document.body);const observer=new MutationObserver(records=>records.forEach(r=>r.addedNodes.forEach(n=>{if(n.nodeType===1)convert(n);else if(n.nodeType===3&&n.parentNode)convert(n.parentNode);})));observer.observe(document.body,{childList:true,subtree:true});});
})();
</script>
</head>
<body><main class="app-container"><section class="card"><h1 class="page-title">🔐 Новый пароль</h1><p style="margin-bottom:12px">Введи новый пароль для аккаунта MuQwiz.</p><input id="newPassword" class="input-field" type="password" minlength="10" autocomplete="new-password" placeholder="Новый пароль (от 10 символов)"><button id="savePassword" class="btn btn-primary" style="margin-top:12px">Сохранить пароль</button><p id="message" role="status" style="margin-top:12px"></p><a href="index.html">Вернуться в MuQwiz</a></section></main><script>
const client=window.supabase.createClient('https://xleqzgqiwayloeeewagv.supabase.co','sb_publishable_ptX6EsSAH92n9XFcP-v9dA_EAOIF7kG');
client.auth.onAuthStateChange((_event,session)=>{if(session) document.getElementById('message').textContent='Ссылка подтверждена. Можно задать новый пароль.';});
document.getElementById('savePassword').addEventListener('click',async()=>{const p=document.getElementById('newPassword').value;const m=document.getElementById('message');if(p.length<10){m.textContent='Пароль должен содержать минимум 10 символов.';return;}const {error}=await client.auth.updateUser({password:p});m.textContent=error?error.message:'Пароль обновлён. Теперь войди с новым паролем.';});
</script></body></html>
